name: Issue Welcome

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Send thank-you comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const issue_number = issue.number;
            const author = issue.user.login;

            // Skip bots to prevent loops
            if (issue.user.type === "Bot" || author.includes("[bot]")) {
              return;
            }

            const marker = "<!-- nuvio-bot:issue-welcome -->";

            // Verify we haven't already posted a welcome comment
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            if (comments.some(c => (c.body || "").includes(marker))) {
              return;
            }

            const labels = (issue.labels || []).map(l => (typeof l === "string" ? l : l.name).toLowerCase());
            const title = (issue.title || "").toLowerCase();

            const isEnhancement = labels.some(l => ["enhancement", "feature", "feature request"].includes(l)) || title.startsWith("[feature]");
            const isBug = labels.some(l => ["bug", "bug report"].includes(l)) || title.startsWith("[bug]");

            let message = "";
            if (isEnhancement) {
              message = `Hi @${author}, thanks for suggesting this enhancement and helping make the app better! 🚀\n\nWe'll review your proposal and share feedback soon.`;
            } else if (isBug) {
              message = `Hi @${author}, thanks for reporting this issue and helping make the app better! 🛠️\n\nWe'll look into it as soon as we can.`;
            } else {
              message = `Hi @${author}, thanks for opening this issue and helping make the app better! ✨\n\nWe'll review it shortly.`;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `${marker}\n${message}`,
            });
